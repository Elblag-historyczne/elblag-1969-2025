
<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elbląg 1969 ↔ 2025</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
  background: #14191f;
  color: white;
}
header {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px;
  background: #202832;
}
header strong { margin-right: auto; font-size: 18px; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}
button, select {
  padding: 9px;
  border: 1px solid #697887;
  border-radius: 7px;
  color: white;
  background: #344659;
  font-size: 14px;
  cursor: pointer;
}
button.active { background: #547fa2; }
#viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: #080b10;
  touch-action: none;
}
#stage {
  position: absolute;
  width: 9140px;
  height: 8151px;
  transform-origin: top left;
  pointer-events: none;
}
#stage img {
  position: absolute;
  top: 0;
  left: 0;
  width: 9140px;
  height: 8151px;
  max-width: none;
}
#oldCover {
  position: absolute;
  inset: 0;
  overflow: hidden;
  clip-path: inset(0 50% 0 0);
}
#divider {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 3px;
  background: white;
  transform: translateX(-50%);
  pointer-events: none;
}
#handle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  background: white;
  color: black;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 25px;
}
.year {
  position: absolute;
  top: 12px;
  padding: 7px 10px;
  border-radius: 6px;
  background: #000b;
  pointer-events: none;
}
#yearOld { left: 12px; }
#yearNew { right: 12px; }
#navigator {
  position: absolute;
  right: 12px;
  bottom: 12px;
  width: 165px;
  aspect-ratio: 9140 / 8151;
  border: 2px solid white;
  border-radius: 7px;
  overflow: hidden;
  touch-action: none;
  background: #222;
}
#navigator img {
  width: 100%;
  height: 100%;
  display: block;
}
#navMark {
  position: absolute;
  border: 2px solid yellow;
  background: #ffff0022;
  pointer-events: none;
}
@media (max-width: 750px) {
  header {
    padding: 8px;
    gap: 7px;
  }
  header strong {
    width: 100%;
    font-size: 16px;
  }
  .controls {
    width: 100%;
    flex-wrap: nowrap;
  }
  .controls button {
    flex: 1;
    padding: 9px 4px;
    font-size: 12px;
  }
  .desktopOnly { display: none !important; }
  #navigator {
    width: 95px;
    right: 7px;
    bottom: 7px;
  }
  .year { font-size: 13px; }
}
</style>
</head>
<body>

<header>
  <strong>Elbląg: 1969 ↔ 2025</strong>
  <div class="controls">
    <button id="slideBtn" class="active">Suwak</button>
    <button id="panBtn">Przesuwanie obrazu</button>
    <button id="minus" class="desktopOnly">−</button>
    <span id="zoomLabel" class="desktopOnly">100%</span>
    <button id="plus" class="desktopOnly">+</button>
    <button id="reset">Dopasuj widok</button>
    <select id="speed" class="desktopOnly">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="3" selected>3×</option>
      <option value="5">5×</option>
      <option value="8">8×</option>
    </select>
  </div>
</header>

<main id="viewport">
  <div id="stage">
    <img src="Elblag_2025_suwak.webp" alt="Elbląg 2025">
    <div id="oldCover">
      <img src="Elblag_1969_suwak.webp" alt="Elbląg 1969">
    </div>
  </div>
  <div id="divider"><div id="handle">↔</div></div>
  <div class="year" id="yearOld">1969</div>
  <div class="year" id="yearNew">2025</div>
  <div id="navigator">
    <img src="Elblag_2025_suwak.webp" alt="Miniatura mapy">
    <div id="navMark"></div>
  </div>
</main>

<script>
const W = 9140, H = 8151;
const vp = document.getElementById("viewport");
const stage = document.getElementById("stage");
const cover = document.getElementById("oldCover");
const divider = document.getElementById("divider");
const mark = document.getElementById("navMark");
const nav = document.getElementById("navigator");

let fit = 1, zoom = 1, x = 0, y = 0;
let position = 0.5, mode = "slide";
let drag = null, pinch = null;
const fingers = new Map();

const clamp = (v, min, max) =>
  Math.max(min, Math.min(max, v));

function redraw() {
  const w = vp.clientWidth, h = vp.clientHeight;
  const s = fit * zoom;
  const iw = W * s, ih = H * s;

  x = iw <= w ? (w - iw) / 2 : clamp(x, w - iw, 0);
  y = ih <= h ? (h - ih) / 2 : clamp(y, h - ih, 0);

  stage.style.transform =
    `translate(${x}px,${y}px) scale(${s})`;
  cover.style.clipPath =
    `inset(0 ${100 - position * 100}% 0 0)`;
  divider.style.left = (position * 100) + "%";

  document.getElementById("zoomLabel").textContent =
    Math.round(zoom * 100) + "%";

  mark.style.left = (clamp(-x / iw, 0, 1) * 100) + "%";
  mark.style.top = (clamp(-y / ih, 0, 1) * 100) + "%";
  mark.style.width = (clamp(w / iw, 0, 1) * 100) + "%";
  mark.style.height = (clamp(h / ih, 0, 1) * 100) + "%";
}

function resetView() {
  fit = Math.min(vp.clientWidth / W, vp.clientHeight / H);
  zoom = 1;
  x = (vp.clientWidth - W * fit) / 2;
  y = (vp.clientHeight - H * fit) / 2;
  redraw();
}

function zoomAt(factor, cx, cy) {
  const oldScale = fit * zoom;
  const imageX = (cx - x) / oldScale;
  const imageY = (cy - y) / oldScale;

  zoom = clamp(zoom * factor, 1, 24);
  const newScale = fit * zoom;

  x = cx - imageX * newScale;
  y = cy - imageY * newScale;
  redraw();
}

function setMode(value) {
  mode = value;
  document.getElementById("slideBtn").classList.toggle(
    "active", mode === "slide"
  );
  document.getElementById("panBtn").classList.toggle(
    "active", mode === "pan"
  );
}

document.getElementById("slideBtn").onclick =
  () => setMode("slide");
document.getElementById("panBtn").onclick =
  () => setMode("pan");
document.getElementById("reset").onclick = resetView;

document.getElementById("plus").onclick = () =>
  zoomAt(1.25, vp.clientWidth / 2, vp.clientHeight / 2);
document.getElementById("minus").onclick = () =>
  zoomAt(0.8, vp.clientWidth / 2, vp.clientHeight / 2);

vp.addEventListener("wheel", e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(
    e.deltaY < 0 ? 1.2 : 1 / 1.2,
    e.clientX - r.left,
    e.clientY - r.top
  );
}, { passive: false });

function localPoint(e) {
  const r = vp.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

vp.addEventListener("pointerdown", e => {
  if (e.target.closest("#navigator")) return;
  vp.setPointerCapture(e.pointerId);
  const p = localPoint(e);
  fingers.set(e.pointerId, p);

  if (fingers.size === 1) {
    drag = { ...p, startX: x, startY: y };
    if (mode === "slide") {
      position = clamp(p.x / vp.clientWidth, 0, 1);
    }
  }

  if (fingers.size === 2) {
    const [a, b] = [...fingers.values()];
    const cx = (a.x + b.x) / 2;
    const cy = (a.y + b.y) / 2;
    pinch = {
      distance: Math.hypot(a.x - b.x, a.y - b.y),
      startZoom: zoom,
      imageX: (cx - x) / (fit * zoom),
      imageY: (cy - y) / (fit * zoom)
    };
    drag = null;
  }
  redraw();
});

vp.addEventListener("pointermove", e => {
  if (!fingers.has(e.pointerId)) return;
  const p = localPoint(e);
  fingers.set(e.pointerId, p);

  if (fingers.size === 2 && pinch) {
    const [a, b] = [...fingers.values()];
    const cx = (a.x + b.x) / 2;
    const cy = (a.y + b.y) / 2;
    const distance = Math.hypot(a.x - b.x, a.y - b.y);

    zoom = clamp(
      pinch.startZoom * distance / Math.max(1, pinch.distance),
      1, 24
    );
    x = cx - pinch.imageX * fit * zoom;
    y = cy - pinch.imageY * fit * zoom;
  } else if (drag && fingers.size === 1) {
    if (mode === "slide") {
      position = clamp(p.x / vp.clientWidth, 0, 1);
    } else {
      const speed = matchMedia("(pointer: coarse)").matches
        ? 3
        : Number(document.getElementById("speed").value);
      x = drag.startX + (p.x - drag.x) * speed;
      y = drag.startY + (p.y - drag.y) * speed;
    }
  }
  redraw();
});

function endTouch(e) {
  fingers.delete(e.pointerId);
  pinch = null;
  if (fingers.size === 1) {
    const p = [...fingers.values()][0];
    drag = { ...p, startX: x, startY: y };
  } else {
    drag = null;
  }
}

vp.addEventListener("pointerup", endTouch);
vp.addEventListener("pointercancel", endTouch);

function jumpTo(e) {
  const r = nav.getBoundingClientRect();
  const u = clamp((e.clientX - r.left) / r.width, 0, 1);
  const v = clamp((e.clientY - r.top) / r.height, 0, 1);
  const s = fit * zoom;
  x = vp.clientWidth / 2 - u * W * s;
  y = vp.clientHeight / 2 - v * H * s;
  redraw();
}

nav.addEventListener("pointerdown", e => {
  e.stopPropagation();
  nav.setPointerCapture(e.pointerId);
  jumpTo(e);
});
nav.addEventListener("pointermove", e => {
  if (nav.hasPointerCapture(e.pointerId)) jumpTo(e);
});

window.addEventListener("keydown", e => {
  if (mode !== "pan") return;
  const amount = 70 * Number(document.getElementById("speed").value);
  if (e.key === "ArrowLeft") x += amount;
  else if (e.key === "ArrowRight") x -= amount;
  else if (e.key === "ArrowUp") y += amount;
  else if (e.key === "ArrowDown") y -= amount;
  else return;
  e.preventDefault();
  redraw();
});

window.addEventListener("resize", resetView);
resetView();
</script>
</body>
</html>
