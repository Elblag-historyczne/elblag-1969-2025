
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Elbląg 1969 ↔ 2025</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden
}
body{
  height:100dvh;display:flex;flex-direction:column;
  background:#0b0e13;color:white;
  font:14px system-ui,Arial,sans-serif;
  overscroll-behavior:none
}
header{
  flex:none;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;padding:8px 10px;
  background:#212b35;position:relative;z-index:5
}
header strong{font-size:16px;margin-right:auto}
.controls{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap
}
button,select{
  border:1px solid #607080;border-radius:6px;
  background:#35485b;color:white;font:inherit;
  padding:7px 9px;cursor:pointer
}
button.active{background:#5684a9}
#zoomText{min-width:43px;text-align:center}
#viewport{
  position:relative;flex:1;min-height:0;overflow:hidden;
  background:#080b10;touch-action:none;
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:contain;cursor:ew-resize
}
#viewport.pan{cursor:grab}
#viewport.dragging.pan{cursor:grabbing}
.layer{
  position:absolute;inset:0;overflow:hidden;
  pointer-events:none
}
.layer img{
  position:absolute;top:0;left:0;
  width:9140px;height:8151px;max-width:none;
  transform-origin:0 0;pointer-events:none;
  -webkit-user-drag:none;will-change:transform
}
#oldLayer{clip-path:inset(0 50% 0 0)}
#divider{
  position:absolute;top:0;bottom:0;left:50%;
  width:2px;transform:translateX(-50%);
  background:white;box-shadow:0 0 3px #000;
  z-index:2;pointer-events:none
}
#handle{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:grid;place-items:center;
  width:42px;height:42px;border-radius:50%;
  background:white;color:black;
  border:1px solid #ddd;font-size:21px
}
.year{
  position:absolute;top:10px;z-index:3;
  padding:5px 8px;border-radius:5px;
  background:#000b;pointer-events:none
}
#yearOld{left:10px}
#yearNew{right:10px}
#navigator{
  position:absolute;right:10px;bottom:10px;
  width:150px;aspect-ratio:9140 / 8151;
  border:2px solid white;border-radius:6px;
  overflow:hidden;z-index:3;touch-action:none;
  background:#111;cursor:crosshair
}
#navigator img{
  width:100%;height:100%;display:block;
  pointer-events:none
}
#navBox{
  position:absolute;border:2px solid yellow;
  background:#ffff0026;pointer-events:none
}
@media(max-width:750px){
  header{padding:7px 8px;gap:5px}
  header strong{width:100%;margin:0}
  .controls{width:100%;flex-wrap:nowrap;gap:5px}
  .controls button{
    flex:1;min-width:0;padding:9px 4px;font-size:12px
  }
  .desktopOnly{display:none!important}
  #navigator{width:95px;right:7px;bottom:7px}
}
</style>
</head>
<body>
<header>
  <strong>Elbląg: 1969 ↔ 2025</strong>
  <div class="controls">
    <button id="slideButton" class="active" type="button">Suwak</button>
    <button id="panButton" type="button">Przesuwanie obrazu</button>
    <button id="minus" type="button" class="desktopOnly">−</button>
    <span id="zoomText" class="desktopOnly">100%</span>
    <button id="plus" type="button" class="desktopOnly">+</button>
    <button id="reset" type="button">Dopasuj widok</button>
    <select id="speed" class="desktopOnly"
            aria-label="Szybkość przesuwania">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="3" selected>3×</option>
      <option value="5">5×</option>
      <option value="8">8×</option>
    </select>
  </div>
</header>

<main id="viewport">
  <div class="layer" id="newLayer">
    <img id="modern"
         src="Elblag_2025_suwak.webp"
         alt="Elbląg 2025" draggable="false">
  </div>

  <div class="layer" id="oldLayer">
    <img id="historic"
         src="Elblag_1969_suwak.webp"
         alt="Elbląg 1969" draggable="false">
  </div>

  <div id="divider"><div id="handle">↔</div></div>

  <span class="year" id="yearOld">1969</span>
  <span class="year" id="yearNew">2025</span>

  <div id="navigator">
    <img src="Elblag_2025_suwak.webp"
         alt="Miniatura" draggable="false">
    <div id="navBox"></div>
  </div>
</main>

<script>
'use strict';

const W=9140,H=8151;
const vp=document.getElementById('viewport');
const oldLayer=document.getElementById('oldLayer');
const divider=document.getElementById('divider');
const modern=document.getElementById('modern');
const historic=document.getElementById('historic');
const navigatorEl=document.getElementById('navigator');
const navBox=document.getElementById('navBox');
const zoomText=document.getElementById('zoomText');
const slideButton=document.getElementById('slideButton');
const panButton=document.getElementById('panButton');

const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

let fit=1,zoom=1,x=0,y=0,split=.5;
let mode='slide',pending=false;

const touches=new Map();
let single=null,pinch=null;

function render(){
  pending=false;

  const vw=vp.clientWidth;
  const vh=vp.clientHeight;
  const s=fit*zoom;

  const t=`translate3d(${x}px,${y}px,0) scale(${s})`;

  modern.style.transform=t;
  historic.style.transform=t;

  // Wspólna współrzędna ekranowa dla granicy i suwaka.
  const boundary=split*vw;

  oldLayer.style.clipPath=
    `inset(0 ${vw-boundary}px 0 0)`;

  divider.style.left=`${boundary}px`;

  zoomText.textContent=Math.round(zoom*100)+'%';

  const iw=W*s,ih=H*s;

  const left=clamp(-x/iw,0,1);
  const top=clamp(-y/ih,0,1);
  const right=clamp((vw-x)/iw,0,1);
  const bottom=clamp((vh-y)/ih,0,1);

  navBox.style.left=(left*100)+'%';
  navBox.style.top=(top*100)+'%';
  navBox.style.width=((right-left)*100)+'%';
  navBox.style.height=((bottom-top)*100)+'%';
}

function requestRender(){
  if(!pending){
    pending=true;
    requestAnimationFrame(render);
  }
}

function resetView(){
  const vw=vp.clientWidth;
  const vh=vp.clientHeight;

  fit=Math.min(vw/W,vh/H);
  zoom=1;

  x=(vw-W*fit)/2;
  y=(vh-H*fit)/2;

  requestRender();
}

function zoomAt(factor,cx,cy){
  const oldS=fit*zoom;
  const px=(cx-x)/oldS;
  const py=(cy-y)/oldS;

  zoom=clamp(zoom*factor,1,24);

  const s=fit*zoom;

  x=cx-px*s;
  y=cy-py*s;

  requestRender();
}

function setMode(m){
  mode=m;

  slideButton.classList.toggle('active',m==='slide');
  panButton.classList.toggle('active',m==='pan');
  vp.classList.toggle('pan',m==='pan');
}

slideButton.addEventListener('click',()=>setMode('slide'));
panButton.addEventListener('click',()=>setMode('pan'));

document.getElementById('reset')
  .addEventListener('click',resetView);

document.getElementById('plus').addEventListener('click',()=>{
  zoomAt(1.25,vp.clientWidth/2,vp.clientHeight/2);
});

document.getElementById('minus').addEventListener('click',()=>{
  zoomAt(0.8,vp.clientWidth/2,vp.clientHeight/2);
});

vp.addEventListener('wheel',e=>{
  e.preventDefault();

  const r=vp.getBoundingClientRect();

  zoomAt(
    e.deltaY<0?1.15:1/1.15,
    e.clientX-r.left,
    e.clientY-r.top
  );
},{passive:false});

function point(e){
  const r=vp.getBoundingClientRect();

  return {
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };
}

function beginPinch(){
  if(touches.size!==2)return;

  const [a,b]=Array.from(touches.values());
  const cx=(a.x+b.x)/2;
  const cy=(a.y+b.y)/2;

  pinch={
    distance:Math.max(
      1,Math.hypot(a.x-b.x,a.y-b.y)
    ),
    initialZoom:zoom,
    imageX:(cx-x)/(fit*zoom),
    imageY:(cy-y)/(fit*zoom)
  };

  single=null;
}

vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('#navigator'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;

  e.preventDefault();
  vp.setPointerCapture(e.pointerId);

  const p=point(e);
  touches.set(e.pointerId,p);

  if(touches.size===1){
    single={
      id:e.pointerId,
      p,
      startX:x,
      startY:y
    };

    if(mode==='slide'&&e.pointerType==='mouse'){
      split=clamp(p.x/vp.clientWidth,0,1);
    }
  }else if(touches.size===2){
    beginPinch();
  }

  vp.classList.add('dragging');
  requestRender();
});

vp.addEventListener('pointermove',e=>{
  if(!touches.has(e.pointerId))return;

  e.preventDefault();

  const p=point(e);
  touches.set(e.pointerId,p);

  if(touches.size===2&&pinch){
    const [a,b]=Array.from(touches.values());

    const cx=(a.x+b.x)/2;
    const cy=(a.y+b.y)/2;
    const dist=Math.hypot(a.x-b.x,a.y-b.y);

    zoom=clamp(
      pinch.initialZoom*dist/pinch.distance,
      1,24
    );

    const s=fit*zoom;
    x=cx-pinch.imageX*s;
    y=cy-pinch.imageY*s;

  }else if(
    touches.size===1 &&
    single &&
    single.id===e.pointerId
  ){
    if(mode==='pan'){
      x=single.startX+p.x-single.p.x;
      y=single.startY+p.y-single.p.y;
    }else{
      split=clamp(p.x/vp.clientWidth,0,1);
    }
  }

  requestRender();
});

function endPointer(e){
  if(!touches.has(e.pointerId))return;

  touches.delete(e.pointerId);
  pinch=null;

  if(touches.size===1){
    const [id,p]=Array.from(touches.entries())[0];

    single={
      id,
      p,
      startX:x,
      startY:y
    };
  }else{
    single=null;
    vp.classList.remove('dragging');
  }

  requestRender();
}

vp.addEventListener('pointerup',endPointer);
vp.addEventListener('pointercancel',endPointer);
vp.addEventListener('lostpointercapture',endPointer);

function panFromMini(e){
  const r=navigatorEl.getBoundingClientRect();

  const u=clamp(
    (e.clientX-r.left)/r.width,0,1
  );

  const v=clamp(
    (e.clientY-r.top)/r.height,0,1
  );

  x=vp.clientWidth/2-u*W*fit*zoom;
  y=vp.clientHeight/2-v*H*fit*zoom;

  requestRender();
}

navigatorEl.addEventListener('pointerdown',e=>{
  e.stopPropagation();
  e.preventDefault();

  navigatorEl.setPointerCapture(e.pointerId);
  panFromMini(e);
});

navigatorEl.addEventListener('pointermove',e=>{
  if(navigatorEl.hasPointerCapture(e.pointerId)){
    panFromMini(e);
  }
});

window.addEventListener('keydown',e=>{
  if(mode!=='pan')return;

  const d=25*Number(
    document.getElementById('speed').value
  );

  if(e.key==='ArrowLeft')x+=d;
  else if(e.key==='ArrowRight')x-=d;
  else if(e.key==='ArrowUp')y+=d;
  else if(e.key==='ArrowDown')y-=d;
  else return;

  e.preventDefault();
  requestRender();
});

window.addEventListener('resize',resetView);

resetView();
</script>
</body>
</html>
