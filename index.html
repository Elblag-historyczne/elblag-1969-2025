<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elbląg 1969 ↔ 2025</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#161a20;color:#f7f7f7;font:15px system-ui,Segoe UI,sans-serif}header{height:54px;display:flex;align-items:center;gap:14px;padding:8px 16px;background:#20262d;flex-wrap:wrap}header strong{margin-right:auto}button{background:#343e49;color:white;border:1px solid #596571;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{background:#475563}button.active{background:#52769a}#viewport{position:absolute;inset:54px 0 0;overflow:hidden;touch-action:none;cursor:ew-resize;background:#111}#stage{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);transform-origin:center center;pointer-events:none}img{position:absolute;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}#oldWrap{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}#split{position:absolute;left:50%;top:0;bottom:0;width:2px;background:white;box-shadow:0 0 8px #000;transform:translateX(-50%);pointer-events:none}#handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;width:42px;height:42px;background:white;color:#161a20;display:grid;place-items:center;font-weight:bold;font-size:20px;box-shadow:0 0 8px #000}#labels{position:absolute;inset:12px 16px auto;display:flex;justify-content:space-between;pointer-events:none}#labels span{background:#0009;padding:5px 10px;border-radius:5px}#info{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000b;border-radius:8px;padding:8px 14px;font-size:13px;pointer-events:none;white-space:nowrap}#navigator{position:absolute;right:16px;bottom:50px;width:154px;height:144px;border:2px solid #fff9;border-radius:7px;overflow:hidden;background:#242c35;box-shadow:0 2px 12px #000a;cursor:crosshair;z-index:3}#navImg{width:100%;height:100%;object-fit:contain}#navCross{position:absolute;width:15px;height:15px;border:2px solid #ffe66d;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 4px #000}#alert{display:none;position:absolute;top:25%;left:50%;transform:translateX(-50%);background:#672d2d;padding:15px;border-radius:6px;max-width:90%;text-align:center;z-index:4}
</style></head><body>
<header><strong>Elbląg: 1969 ↔ 2025</strong><button id="slideBtn" class="active">Suwak</button><button id="panBtn">Przesuwanie obrazu</button><button id="minus">−</button><span id="zoomText">100%</span><button id="plus">+</button><button id="reset">Dopasuj widok</button><label style="white-space:nowrap">Szybkość przesuwania: <select id="speed" style="background:#343e49;color:#fff;border:1px solid #596571;border-radius:5px;padding:5px"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3×</option><option value="5">5×</option><option value="8">8×</option></select></label></header>
<main id="viewport"><div id="stage"><img id="new" src="Elblag_2025_suwak.webp" alt="Ortofotomapa z 2025 roku"><div id="oldWrap"><img id="old" src="Elblag_1969_suwak.webp" alt="Fotografia z 1969 roku"></div></div><div id="split"><div id="handle">↔</div></div><div id="labels"><span>1969</span><span>2025</span></div><div id="navigator" title="Kliknij na miniaturze, aby natychmiast przejść do wskazanego miejsca"><img id="navImg" src="Elblag_2025_suwak.webp" alt="Miniatura mapy"><span id="navCross"></span></div><div id="alert">Nie udało się wczytać zdjęć. Umieść ten plik HTML w tym samym folderze co <b>Elblag_1969_suwak.webp</b> i <b>Elblag_2025_suwak.webp</b>.</div><div id="info">Suwak: odsłanianie zdjęć • Przesuwanie: przeciągnij obraz • Miniatura: przeskok w dowolne miejsce</div></main>
<script>
const viewport=document.getElementById('viewport'),stage=document.getElementById('stage'),oldWrap=document.getElementById('oldWrap'),split=document.getElementById('split');let pct=50,zoom=1,dx=0,dy=0,mode='slide',drag=false,lastX=0,lastY=0;
const zoomText=document.getElementById('zoomText'),nav=document.getElementById('navigator'),navCross=document.getElementById('navCross'),speed=document.getElementById('speed');function render(){stage.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${zoom})`;const w=viewport.clientWidth, boundary=(pct/100*w-(w/2+dx-zoom*w/2))/(zoom*w)*100;oldWrap.style.clipPath=`inset(0 ${100-boundary}% 0 0)`;split.style.left=pct+'%';zoomText.textContent=Math.round(zoom*100)+'%';const r=viewport.getBoundingClientRect(),nr=nav.getBoundingClientRect();const iw=9140,ih=8151,fit=Math.min(nr.width/iw,nr.height/ih);const nw=iw*fit,nh=ih*fit;const x=clamp(-dx/(r.width*zoom)+.5,0,1),y=clamp(-dy/(r.height*zoom)+.5,0,1);navCross.style.left=((nr.width-nw)/2+nw*x)+'px';navCross.style.top=((nr.height-nh)/2+nh*y)+'px'}
function setMode(m){mode=m;document.getElementById('slideBtn').classList.toggle('active',m==='slide');document.getElementById('panBtn').classList.toggle('active',m==='pan');viewport.style.cursor=m==='slide'?'ew-resize':'grab'}
document.getElementById('slideBtn').onclick=()=>setMode('slide');document.getElementById('panBtn').onclick=()=>setMode('pan');
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function zoomBy(f){zoom=clamp(zoom*f,1,12);render()};document.getElementById('plus').onclick=()=>zoomBy(1.25);document.getElementById('minus').onclick=()=>zoomBy(.8);document.getElementById('reset').onclick=()=>{zoom=1;dx=dy=0;pct=50;render()};
viewport.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.12:1/1.12)},{passive:false});viewport.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;viewport.setPointerCapture(e.pointerId);if(mode==='slide')updateSplit(e)});viewport.addEventListener('pointermove',e=>{if(!drag)return;if(mode==='pan'){dx+=(e.clientX-lastX)*Number(speed.value);dy+=(e.clientY-lastY)*Number(speed.value)}else updateSplit(e);lastX=e.clientX;lastY=e.clientY;render()});viewport.addEventListener('pointerup',()=>drag=false);viewport.addEventListener('pointercancel',()=>drag=false);
function updateSplit(e){const r=viewport.getBoundingClientRect();pct=clamp((e.clientX-r.left)/r.width*100,0,100);render()}
nav.addEventListener('pointerdown',e=>{e.stopPropagation();const nr=nav.getBoundingClientRect(),vr=viewport.getBoundingClientRect(),scale=Math.min(nr.width/9140,nr.height/8151),nw=9140*scale,nh=8151*scale,x=clamp((e.clientX-nr.left-(nr.width-nw)/2)/nw,0,1),y=clamp((e.clientY-nr.top-(nr.height-nh)/2)/nh,0,1);dx=(.5-x)*vr.width*zoom;dy=(.5-y)*vr.height*zoom;render()});document.addEventListener('keydown',e=>{if(mode!=='pan'||['INPUT','SELECT'].includes(document.activeElement.tagName))return;let d=140*Number(speed.value);if(e.key==='ArrowUp')dy+=d;else if(e.key==='ArrowDown')dy-=d;else if(e.key==='ArrowLeft')dx+=d;else if(e.key==='ArrowRight')dx-=d;else return;e.preventDefault();render()});let errors=0;for(const id of ['old','new'])document.getElementById(id).addEventListener('error',()=>{errors++;document.getElementById('alert').style.display='block'});
render();
</script></body></html>
